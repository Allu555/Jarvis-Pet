name: CI & Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Verify (Python ${{ matrix.python-version }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax (All Modules)
        shell: python
        run: |
          import compileall, sys
          success = compileall.compile_dir(".", quiet=1)
          if not success:
              sys.exit("Python syntax compilation failed!")
          print("All Python modules compiled successfully with 100% syntax validity!")

      - name: Verify Core Imports & Subsystems
        shell: python
        run: |
          import PySide6
          import PIL
          import qrcode
          import json
          from pathlib import Path

          print("PySide6 Version:", PySide6.__version__)
          print("Pillow Version: ", PIL.__version__)

          # Test QRCode generation
          test_qr = qrcode.make("https://github.com/Allu555/Jarvis-Pet")
          print("QRCode Engine:    Verified & Active")

          # Validate configuration JSON
          settings_file = Path("settings.json")
          if settings_file.exists():
              with open(settings_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
              print(f"settings.json:    Valid ({len(data)} configuration keys)")

          print("All verification checks passed successfully!")
